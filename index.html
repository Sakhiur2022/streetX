<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Car tracker</title>
  <meta name="theme-color" media="(prefers-color-scheme: light)" content="#e4d6b4">
  <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1a1612">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Big+Shoulders+Display:wght@700;800&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app">
    <aside id="side" hidden>
      <div id="plate"></div>
      <nav id="nav" aria-label="Main"></nav>
      <button type="button" id="out" class="ghost">Sign out</button>
    </aside>
    <main id="view"></main>
  </div>
  <dialog id="dlg"></dialog>
  <div id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
